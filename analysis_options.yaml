include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # nâng vài lint thành lỗi để CI chặn cứng
    avoid_print: error
    prefer_const_constructors: warning

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
    - avoid_dynamic_calls
    - require_trailing_commas

# Ghi chú: riverpod_lint đã bỏ (xung đột analyzer với build_runner trên Flutter 3.44.1
# — xem docs/decisions.md). Các luật kiến trúc quan trọng nhất được ép bằng tool/check_arch.sh
# thay vì analyzer plugin.
